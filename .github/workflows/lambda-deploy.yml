name: Deploy track analyzer Lambda

on:
  pull_request:
    paths:
      - ".github/workflows/lambda-deploy.yml"
      - "lambda/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/lambda-deploy.yml"
      - "lambda/**"

permissions:
  contents: read

concurrency:
  group: lambda-terraform-state
  cancel-in-progress: false

jobs:
  plan:
    name: Terraform plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lambda/terraform
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-west-2' }}
      TF_VAR_bucket_name: ${{ vars.LAMBDA_BUCKET_NAME }}
      TF_VAR_track_prefix: ${{ vars.LAMBDA_TRACK_PREFIX || 'tracks/' }}
      TF_VAR_results_prefix: ${{ vars.LAMBDA_RESULTS_PREFIX || 'analysis' }}
      TF_VAR_results_bucket_name: ${{ vars.LAMBDA_RESULTS_BUCKET_NAME }}
      TF_VAR_function_name: ${{ vars.LAMBDA_FUNCTION_NAME || 'track-analyzer' }}
      TF_VAR_iam_role_name: ${{ vars.LAMBDA_IAM_ROLE_NAME || 'track-analyzer-prod-role' }}
      TF_VAR_backend_webhook_url: ${{ vars.BACKEND_WEBHOOK_URL }}
      TF_VAR_backend_webhook_api_key: ${{ secrets.BACKEND_WEBHOOK_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        run: terraform init -input=false -backend-config="key=lambda/prod/terraform.tfstate"

      - name: Validate Terraform
        run: terraform validate

      - name: Plan infrastructure changes
        run: terraform plan -input=false -no-color -var="image_tag=pr-${{ github.event.pull_request.head.sha }}"

  deploy:
    name: Build and apply Lambda
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lambda/terraform
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-west-2' }}
      TF_VAR_bucket_name: ${{ vars.LAMBDA_BUCKET_NAME }}
      TF_VAR_track_prefix: ${{ vars.LAMBDA_TRACK_PREFIX || 'tracks/' }}
      TF_VAR_results_prefix: ${{ vars.LAMBDA_RESULTS_PREFIX || 'analysis' }}
      TF_VAR_results_bucket_name: ${{ vars.LAMBDA_RESULTS_BUCKET_NAME }}
      TF_VAR_function_name: ${{ vars.LAMBDA_FUNCTION_NAME || 'track-analyzer' }}
      TF_VAR_iam_role_name: ${{ vars.LAMBDA_IAM_ROLE_NAME || 'track-analyzer-prod-role' }}
      TF_VAR_backend_webhook_url: ${{ vars.BACKEND_WEBHOOK_URL }}
      TF_VAR_backend_webhook_api_key: ${{ secrets.BACKEND_WEBHOOK_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        run: terraform init -input=false -backend-config="key=lambda/prod/terraform.tfstate"

      - name: Create ECR repository
        run: terraform apply -input=false -auto-approve -target=aws_ecr_repository.track_analyzer

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Lambda image
        working-directory: lambda
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME || 'track-analyzer' }}
        run: |
          docker build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --tag "$ECR_REGISTRY/$LAMBDA_FUNCTION_NAME:$IMAGE_TAG" \
            .
          docker push "$ECR_REGISTRY/$LAMBDA_FUNCTION_NAME:$IMAGE_TAG"

      - name: Create Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan -var="image_tag=$IMAGE_TAG"

      - name: Apply Terraform plan
        run: terraform apply -input=false -no-color tfplan
